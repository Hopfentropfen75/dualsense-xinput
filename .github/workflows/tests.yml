name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Windows, weil Spielerkennung und XInput ctypes-Aufrufe ins System machen.
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Nur was die Tests brauchen - vgamepad wuerde den ViGEmBus-Treiber
      # installieren wollen.
      - run: python -m pip install hidapi Pillow
      - run: python -m unittest discover -s tests -v

  build:
    # Baut DualSense.exe und stellt sie als Download am Lauf bereit.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install hidapi pystray Pillow pyinstaller
      # vgamepad gibt es nur als Quellpaket, dessen setup.py den
      # ViGEmBus-Installer startet - der wartet auf dem Runner ewig auf
      # einen Klick. Deshalb nur entpacken und per PYTHONPATH einbinden.
      - name: vgamepad ohne Treiber-Installer
        shell: bash
        run: |
          curl -sL https://files.pythonhosted.org/packages/source/v/vgamepad/vgamepad-0.1.0.tar.gz | tar xz
          echo "PYTHONPATH=$(pwd)/vgamepad-0.1.0" >> "$GITHUB_ENV"
      - run: python -c "import vgamepad.win.vigem_client, os; print(os.path.dirname(vgamepad.__file__))"
      - run: python build.py
      - uses: actions/upload-artifact@v7
        with:
          name: DualSense-windows
          path: dist/DualSense
